<svg xmlns="http://www.w3.org/2000/svg" width="880" height="124" viewBox="0 0 880 124" role="img" aria-label="메일 한 통이 수신에서 검색까지 지나가는 경로: 수신·발송, 검사·필터, 파싱·인덱싱, 보관, 검색·조회">
<style>
  .cap { font: 400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; }
  .lbl { font: 400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; text-anchor: middle; }
  .box { fill: none; stroke-opacity: .32; stroke-width: 1.2; }
  .ic  { fill: none; stroke-opacity: .8; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .wire{ stroke: #8b949e; stroke-opacity: .25; stroke-width: 1.2; }
  g.n { stroke: #8b949e; animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .n1 { animation-name: p1 } .n2 { animation-name: p2 } .n3 { animation-name: p3 }
  .n4 { animation-name: p4 } .n5 { animation-name: p5 }
  @keyframes p1 { 0%{stroke:#8b949e} 3%,10%{stroke:#4493f8} 20%,100%{stroke:#8b949e} }
  @keyframes p2 { 0%,19%{stroke:#8b949e} 25%,32%{stroke:#4493f8} 42%,100%{stroke:#8b949e} }
  @keyframes p3 { 0%,41%{stroke:#8b949e} 47%,54%{stroke:#4493f8} 64%,100%{stroke:#8b949e} }
  @keyframes p4 { 0%,63%{stroke:#8b949e} 69%,76%{stroke:#4493f8} 86%,100%{stroke:#8b949e} }
  @keyframes p5 { 0%,85%{stroke:#8b949e} 91%,97%{stroke:#4493f8} 100%{stroke:#8b949e} }
</style>

<text x="62" y="14" class="cap">메일 한 통이 들어와 검색되기까지 — 내가 맡는 구간</text>

