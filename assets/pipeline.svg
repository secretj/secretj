  <circle r="3.4"><animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" path="M106,62 H240" keyTimes="0;0.06;0.2;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.05;0.07;0.2;0.22;1"/></circle>
  <circle r="3.4"><animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" path="M284,62 H418" keyTimes="0;0.28;0.42;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.27;0.29;0.42;0.44;1"/></circle>
  <circle r="3.4"><animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" path="M462,62 H596" keyTimes="0;0.5;0.64;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.64;0.66;1"/></circle>
  <circle r="3.4"><animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" path="M640,62 H774" keyTimes="0;0.72;0.86;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.71;0.73;0.86;0.88;1"/></circle>
