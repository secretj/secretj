<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" role="img" aria-label="지난 1년 활동 1,678건, 유지 중인 저장소 12개, 예전에 만든 저장소 57개, 언어 비중 Java 46% TypeScript 27% Kotlin 14% CSS 7% 기타 6%">
<style>
  .num { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #4493f8; }
  .cap { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; }
  .hdr { font: 600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; letter-spacing: .06em; }
  .lg  { font: 400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; }
  .bar { transform-origin: 28px 130px; animation: grow 1s .25s cubic-bezier(.2,.8,.3,1) }
  @keyframes grow { 0% { transform: scaleX(0) } 100% { transform: scaleX(1) } }
</style>
<rect x="0.5" y="0.5" width="879" height="175" rx="10" fill="none" stroke="#8b949e" stroke-opacity=".28"/>

<g><text x="28" y="48" class="num">1,678</text><text x="28" y="68" class="cap">지난 1년 활동</text></g>
<g><text x="316" y="48" class="num">12</text><text x="316" y="68" class="cap">지금 쓰는 저장소</text></g>
<g><text x="604" y="48" class="num">57</text><text x="604" y="68" class="cap">예전에 만든 저장소</text></g>

<line x1="28" y1="90" x2="852" y2="90" stroke="#8b949e" stroke-opacity=".22"/>
<text x="28" y="114" class="hdr">주로 쓰는 언어 · 지금 쓰는 저장소 기준</text>

<g class="bar" clip-path="inset(0 round 4.5)">
  <rect x="28.0"  y="126" width="379.0" height="9" fill="#b07219"/>
  <rect x="407.0" y="126" width="222.5" height="9" fill="#3178c6"/>
  <rect x="629.5" y="126" width="115.4" height="9" fill="#A97BFF"/>
  <rect x="744.9" y="126" width="57.7"  height="9" fill="#663399"/>
  <rect x="802.6" y="126" width="49.4"  height="9" fill="#8b949e"/>
</g>

<g>
  <circle cx="32"  cy="158" r="4" fill="#b07219"/><text x="42"  y="162" class="lg">Java 46%</text>
  <circle cx="122" cy="158" r="4" fill="#3178c6"/><text x="132" y="162" class="lg">TypeScript 27%</text>
  <circle cx="249" cy="158" r="4" fill="#A97BFF"/><text x="259" y="162" class="lg">Kotlin 14%</text>
  <circle cx="376" cy="158" r="4" fill="#663399"/><text x="386" y="162" class="lg">CSS 7%</text>
  <circle cx="453" cy="158" r="4" fill="#8b949e"/><text x="463" y="162" class="lg">기타 6%</text>
</g>
</svg>
