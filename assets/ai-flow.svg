<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 12 880 148" role="img" aria-label="할 일 하나를 처리하는 순서: 할 일에서 출발해 코드 탐색·도메인 지식·이슈 문서를 서브에이전트로 병렬 조사한 뒤 계획·구현, 테스트·리뷰, 커밋·PR 로 이어진다">
<style>
  .txt { font: 400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; text-anchor: middle; }
  .pill{ fill: none; stroke-opacity: .34; stroke-width: 1.2; }
  .wire{ fill: none; stroke: #8b949e; stroke-opacity: .25; stroke-width: 1.2; }
  g.n { stroke: #8b949e; animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .a  { animation-name: pa } .b { animation-name: pb } .c { animation-name: pc }
  .d  { animation-name: pd } .e { animation-name: pe }
  @keyframes pa { 0%,4%{stroke:#4493f8} 14%,100%{stroke:#8b949e} }
  @keyframes pb { 0%,23%{stroke:#8b949e} 26%,32%{stroke:#4493f8} 42%,100%{stroke:#8b949e} }
  @keyframes pc { 0%,53%{stroke:#8b949e} 56%,62%{stroke:#4493f8} 70%,100%{stroke:#8b949e} }
  @keyframes pd { 0%,73%{stroke:#8b949e} 76%,82%{stroke:#4493f8} 90%,100%{stroke:#8b949e} }
  @keyframes pe { 0%,91%{stroke:#8b949e} 95%,100%{stroke:#4493f8} }
</style>

