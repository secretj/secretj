<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="웹·앱·외부 시스템의 요청이 API 서버로 들어오고, 서버가 데이터베이스·캐시·검색·배치로 뻗었다가 응답으로 돌아나가는 구조">
<style>
  .t  { font: 400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; text-anchor: middle; }
  .tb { font: 600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill: #8b949e; text-anchor: middle; }
  .pill { fill: none; stroke-opacity: .34; stroke-width: 1.2; }
  .wire { fill: none; stroke: #8b949e; stroke-opacity: .25; stroke-width: 1.2; }
  g.n { stroke: #8b949e; animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .a { animation-name: pa } .b { animation-name: pb } .c { animation-name: pc }
  @keyframes pa { 0%,6%{stroke:#4493f8} 16%,82%{stroke:#8b949e} 86%,92%{stroke:#4493f8} 100%{stroke:#8b949e} }
  @keyframes pb { 0%,11%{stroke:#8b949e} 14%,20%{stroke:#4493f8} 30%,61%{stroke:#8b949e} 64%,70%{stroke:#4493f8} 80%,100%{stroke:#8b949e} }
  @keyframes pc { 0%,33%{stroke:#8b949e} 36%,44%{stroke:#4493f8} 54%,100%{stroke:#8b949e} }
</style>

